[project]
name = "cln"
version = "0.1.0"
description = "Pricing and hedging a first-to-default basket credit-linked note"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zak Claridge" }]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.1", "scipy>=1.14", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cln"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]
